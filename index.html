<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Feature Compatibility Evaluator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111418'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' font-size='34' font-family='monospace' fill='%23f3f4ef'%3EJS%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>JavaScript Feature Compatibility Evaluator</h1>
        <div>
          Evaluates native APIs, modern methods, and dynamic language syntax in
          real-time.
        </div>
        <div class="user-agent" id="ua-display">User Agent: Detecting...</div>

        <div class="stats-bar">
          <div class="stat-box">
            <div class="stat-value stat-total" id="stat-total">0</div>
            <div class="stat-label">Total Tests</div>
          </div>
          <div class="stat-box">
            <div class="stat-value stat-pass" id="stat-pass">0</div>
            <div class="stat-label">Supported</div>
          </div>
          <div class="stat-box">
            <div class="stat-value stat-fail" id="stat-fail">0</div>
            <div class="stat-label">Unsupported</div>
          </div>
        </div>
      </header>

      <!-- Custom Syntax Tester -->
      <div class="card custom-tester">
        <h2>Interactive Syntax Evaluator</h2>
        <p style="font-size: 13px; color: #6b7280; margin-bottom: 8px">
          Test custom ES syntax dynamically via <code>eval()</code>:
        </p>
        <input
          type="text"
          id="custom-code-input"
          value="() => { const { a = 1 } = {}; return a; }"
          placeholder="e.g. () => {} or [1, 2]?.at(0)"
        />
        <button class="btn" onclick="runCustomTest()">Evaluate Syntax</button>
        <div id="custom-result" class="custom-result"></div>
      </div>

      <!-- Filters -->
      <div class="controls">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search feature name..."
          onkeyup="filterResults()"
        />
        <button class="filter-btn active" onclick="setFilter('all', this)">
          All
        </button>
        <button class="filter-btn" onclick="setFilter('pass', this)">
          Supported
        </button>
        <button class="filter-btn" onclick="setFilter('fail', this)">
          Unsupported
        </button>
      </div>

      <!-- Test Results Output Container -->
      <div id="results-container"></div>
    </div>

    <script src="./features.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
